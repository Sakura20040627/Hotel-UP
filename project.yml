name: HotelFlow
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.3"
    CURRENT_PROJECT_VERSION: "4"
    HOTELFLOW_BUNDLE_ID: com.hotelflow.ios
    HOTELFLOW_APP_GROUP: group.com.hotelflow.ios
targets:
  HotelFlow:
    type: application
    platform: iOS
    sources: [App, Core]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HOTELFLOW_BUNDLE_ID)
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Core/Group.entitlements
    dependencies:
      - target: HotelFlowShare
        embed: true
  HotelFlowShare:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Core/Inbox.swift
      - Core/PDFInput.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HOTELFLOW_BUNDLE_ID).share
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Core/Group.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
  HotelFlowTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: HotelFlow
schemes:
  HotelFlow:
    build:
      targets:
        HotelFlow: all
    test:
      targets: [HotelFlowTests]
